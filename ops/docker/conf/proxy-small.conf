# CVE-2026-123633 노출 변형(경합 압축) — 작은 worker_connections로 drain 경로 강제
# 메커니즘(deep-analysis-CVE-2026-123633.md): 불완전 프레임 커넥션도 reusable 등록(1.31.8)
# → worker_connections 고갈 시 drain이 고름 → c->close=1 후 핸들러 동기 호출로 스트림 생성
# → GOAWAY 실패 시 즉시 해제 → 처리 중 upstream과 경합 UAF
worker_processes      1;
working_directory     /cores;
error_log             /dev/stderr debug;   # drain/reusable 이벤트 추적용
pid                   logs/nginx.pid;

events {
    worker_connections 16;    # 경합 압축: drain 임계(free ≤ n/16)에 빠르게 도달
}

http {
    log_format h2_hunt '$time_iso8601 src=$remote_addr conn=$connection '
                       'requests=$connection_requests proto=$server_protocol '
                       'status=$status request_length=$request_length '
                       'bytes_sent=$bytes_sent request_time=$request_time';
    access_log /dev/stdout h2_hunt;

    upstream backend {
        server slowback:8080;
        keepalive 4;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate      /usr/local/nginx/conf/certs/server.crt;
        ssl_certificate_key  /usr/local/nginx/conf/certs/server.key;

        # /hang: 장기 미응답 — 스트림 처리 중(upstream 접속/대기) 상태를 길게 유지
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
        }
    }
}
