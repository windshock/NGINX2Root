# CVE-2026-123634 재설계 변형 — upstream resolve + mirror (커밋 e39708edc 시나리오)
# 커밋 메시지 실측: "upstream resolve에서 최소 하나의 서브리퀘스트가 같은 이름을 해석 중,
# 요청이 upstream resolve 핸들러에서 종료될 때 UAF" — same-name 보고 루프에서
# 다른(non-current) resolve의 done() 경로. "could not cancel" ALERT가 흔적.
worker_processes      1;
working_directory     /cores;
error_log             /dev/stderr debug;
pid                   logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    log_format h2_hunt '$time_iso8601 src=$remote_addr conn=$connection '
                       'requests=$connection_requests proto=$server_protocol '
                       'status=$status request_length=$request_length '
                       'bytes_sent=$bytes_sent request_time=$request_time';
    access_log /dev/stdout h2_hunt;

    resolver dnssim:53 valid=0s ipv6=off;   # 캐시 없음 — 요청마다 재해석 (ctx 누적)

    # upstream resolve: 요청마다 이름 해석 (e39708edc 시나리오의 "upstream resolve")
    # zone 필수 — "resolving names at run time requires upstream in shared memory" (실측)
    upstream backend {
        zone backend 64k;
        server x.d3.test:80 resolve;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate      /usr/local/nginx/conf/certs/server.crt;
        ssl_certificate_key  /usr/local/nginx/conf/certs/server.key;

        location / {
            mirror /mirror;               # 서브리퀘스트가 같은 upstream → 같은 이름 해석
            proxy_pass http://backend;    # connect 127.0.0.1:80 → 즉시 거부 (동기 종료)
        }

        location = /mirror {
            internal;
            proxy_pass http://backend;
        }
    }
}
