# CVE-2026-113425 노출 변형 — Mail Proxy 인증 연결 (auth_http 경합)
# 흐름: 클라이언트(IMAP LOGIN) → nginx → authsim(auth_http) → Auth-Server:imapsim 프록시
worker_processes      1;

working_directory     /cores;
error_log             /dev/stderr debug;
pid                   logs/nginx.pid;

mail {
    server {
        listen       143;
        protocol     imap;
        proxy        on;
        auth_http    http://authsim:9000/auth;

        # authsim 응답 헤더로 프록시 대상이 결정됨 (Auth-Server/Auth-Port)
    }
}

# http 블록은 stub_status용 최소 구성 (헬스체크/버전 확인)
http {
    server {
        listen 8080;
        location = /status { stub_status; }
    }
}
