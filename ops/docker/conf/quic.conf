# CVE-2026-121810 노출 변형 — HTTP/3(QUIC) + upstream 프록시, 스트림/연결 종료 경합
# 주의: bookworm의 OpenSSL 3.0으로는 QUIC TLS 핸드셰이크가 불완전할 수 있음.
# 이 변형은 BASE=debian:trixie-slim(OpenSSL 3.5+) 빌드 사용 권장 (compose 참조).
worker_processes      1;

working_directory     /cores;
error_log             /dev/stderr debug;
pid                   logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    log_format h2_hunt '$time_iso8601 src=$remote_addr conn=$connection '
                       'requests=$connection_requests proto=$server_protocol '
                       'status=$status request_length=$request_length '
                       'bytes_sent=$bytes_sent request_time=$request_time';
    access_log /dev/stdout h2_hunt;

    upstream backend {
        server slowback:8080;
    }

    server {
        listen 443 ssl;
        listen 443 quic reuseport;
        http2 on;
        http3 on;

        ssl_certificate      /usr/local/nginx/conf/certs/server.crt;
        ssl_certificate_key  /usr/local/nginx/conf/certs/server.key;

        add_header Alt-Svc 'h3=":443"; ma=86400';

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
