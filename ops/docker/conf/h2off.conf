# A3(완화 arm) — 동일 바이너리(1.31.8)에서 HTTP/2만 OFF
# 완화 효과 실측: 동일 트리거 입력이 A1과 달리 무해해야 함 (RESEARCH-PLAN H1)
worker_processes      auto;

working_directory     /cores;
error_log             /dev/stderr notice;
pid                   logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    log_format h2_hunt '$time_iso8601 src=$remote_addr conn=$connection '
                       'requests=$connection_requests proto=$server_protocol '
                       'status=$status request_length=$request_length '
                       'bytes_sent=$bytes_sent request_time=$request_time';
    access_log /dev/stdout h2_hunt;

    server {
        listen 443 ssl;
        # http2 off; (기본값 off — 명시적 지시문 없음. nginx >= 1.25.1)
        ssl_certificate      /usr/local/nginx/conf/certs/server.crt;
        ssl_certificate_key  /usr/local/nginx/conf/certs/server.key;

        location / {
            root  /usr/local/nginx/html;
            index index.html;
        }
    }
}
